trigger: none

pool:
  vmImage: 'ubuntu-latest'

variables:
  imageName: 'crm-backend-hr'
  registry: 'registry.nafabarter.com'
  fullImageName: '$(registry)/$(imageName)'
  tag: '$(Build.BuildId)'

steps:

- task: Docker@2
  displayName: 'Build and push $(imageName)'
  inputs:
    command: buildAndPush
    containerRegistry: 'nafa-registry'
    repository: '$(imageName)'
    Dockerfile: '**/Dockerfile'
    tags: |
      latest
      $(tag)

- script: |
    curl -X POST -k https://89.116.20.215:9443/api/stacks/webhooks/4173be62-b5d0-4073-9fda-ffdecea4c731?IMAGE_TAG=$(Build.BuildId)
  displayName: 'Trigger Portainer webhook deployment'
  condition: succeeded()