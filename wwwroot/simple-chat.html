<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>CRM Chat - Team Messaging</title>
  
  <!-- SignalR -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/microsoft-signalr/8.0.0/signalr.min.js"></script>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
      background: #f0f2f5;
      color: #333;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .header {
      padding: 16px 20px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    .header h1 {
      font-size: 20px;
      font-weight: 600;
    }

    .user-info {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .status-indicator {
      width: 12px;
      height: 12px;
      background: #4caf50;
      border-radius: 50%;
    }

    .header-menu-btn {
      width: 36px;
      height: 36px;
      border: none;
      border-radius: 6px;
      background: rgba(255,255,255,0.2);
      color: white;
      cursor: pointer;
      font-size: 18px;
      transition: all 0.2s;
    }

    .header-menu-btn:hover {
      background: rgba(255,255,255,0.3);
    }

    .menu-modal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      display: none;
      align-items: flex-start;
      justify-content: flex-end;
      z-index: 1000;
      animation: slideIn 0.3s ease;
    }

    .menu-modal.open {
      display: flex;
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateX(100px); }
      to { opacity: 1; transform: translateX(0); }
    }

    .menu-panel {
      width: 380px;
      height: 100%;
      background: white;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: -2px 0 12px rgba(0,0,0,0.2);
    }

    .menu-header {
      padding: 20px;
      border-bottom: 1px solid #e0e0e0;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .menu-header h2 {
      font-size: 18px;
      font-weight: 600;
    }

    .menu-close-btn {
      width: 32px;
      height: 32px;
      border: none;
      border-radius: 6px;
      background: #f5f5f5;
      color: #333;
      cursor: pointer;
      font-size: 18px;
    }

    .menu-close-btn:hover {
      background: #e0e0e0;
    }

    .menu-content {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
    }

    .menu-item {
      padding: 12px 16px;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 14px;
      transition: all 0.2s;
      color: #333;
    }

    .menu-item:hover {
      background: #f0f0f0;
    }

    .menu-item.active {
      background: #e8eaf6;
      color: #667eea;
      font-weight: 600;
    }

    .menu-icon {
      font-size: 18px;
      width: 24px;
      text-align: center;
    }

    .history-view {
      display: none;
      position: fixed;
      right: 0;
      top: 0;
      width: 380px;
      height: 100%;
      background: white;
      flex-direction: column;
      z-index: 1001;
      box-shadow: -2px 0 12px rgba(0,0,0,0.2);
      animation: slideIn 0.3s ease;
    }

    .history-view.active {
      display: flex;
    }

    .history-items {
      flex: 1;
      overflow-y: auto;
      padding: 0;
    }

    .history-item {
      padding: 12px 16px;
      border-bottom: 1px solid #f0f0f0;
      display: flex;
      gap: 12px;
    }

    .history-item-avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: #667eea;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 600;
      flex-shrink: 0;
    }

    .history-item-content {
      flex: 1;
    }

    .history-item-header {
      display: flex;
      justify-content: space-between;
      margin-bottom: 4px;
    }

    .history-item-user {
      font-size: 13px;
      font-weight: 600;
      color: #1a1a1a;
    }

    .history-item-time {
      font-size: 11px;
      color: #999;
    }

    .history-item-text {
      font-size: 12px;
      color: #666;
    }

    .history-item-type {
      font-size: 11px;
      color: #999;
      margin-top: 4px;
    }

    .container {
      display: flex;
      flex: 1;
      overflow: hidden;
      gap: 1px;
    }

    .sidebar {
      width: 280px;
      background: white;
      border-right: 1px solid #e0e0e0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .search-section {
      padding: 12px;
      border-bottom: 1px solid #e0e0e0;
    }

    .search-box {
      position: relative;
    }

    .search-box input {
      width: 100%;
      padding: 8px 10px 8px 32px;
      border: 1px solid #d0d0d0;
      border-radius: 6px;
      font-size: 13px;
      background: #f5f5f5;
    }

    .search-box input:focus {
      outline: none;
      background: white;
      border-color: #667eea;
    }

    .search-box::before {
      content: '🔍';
      position: absolute;
      left: 10px;
      top: 50%;
      transform: translateY(-50%);
    }

    .contacts-list {
      flex: 1;
      overflow-y: auto;
      padding: 8px;
    }

    .contact-item {
      padding: 10px 12px;
      margin-bottom: 4px;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .contact-item:hover {
      background: #f5f5f5;
    }

    .contact-item.active {
      background: #e8eaf6;
      border-left: 3px solid #667eea;
    }

    .contact-avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: #667eea;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: 600;
      flex-shrink: 0;
    }

    .contact-info {
      flex: 1;
      min-width: 0;
    }

    .contact-name {
      font-size: 13px;
      font-weight: 600;
      color: #1a1a1a;
    }

    .contact-id {
      font-size: 12px;
      color: #999;
    }

    .chat-area {
      flex: 1;
      background: white;
      display: flex;
      flex-direction: column;
    }

    .chat-header {
      padding: 16px 20px;
      border-bottom: 1px solid #e0e0e0;
      background: white;
    }

    .chat-title {
      font-size: 15px;
      font-weight: 600;
      color: #1a1a1a;
    }

    .chat-subtitle {
      font-size: 12px;
      color: #999;
      margin-top: 4px;
    }

    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 16px 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .empty-state {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100%;
      flex-direction: column;
      color: #999;
    }

    .empty-icon {
      font-size: 64px;
      margin-bottom: 16px;
      opacity: 0.3;
    }

    .message {
      display: flex;
      gap: 8px;
      margin-bottom: 8px;
    }

    .message.own {
      justify-content: flex-end;
    }

    .message-avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: #667eea;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 600;
      flex-shrink: 0;
    }

    .message-bubble {
      max-width: 60%;
      padding: 10px 14px;
      border-radius: 12px;
      background: #f0f0f0;
      color: #1a1a1a;
      font-size: 13px;
      line-height: 1.4;
      word-wrap: break-word;
    }

    .message.own .message-bubble {
      background: #667eea;
      color: white;
      border-bottom-right-radius: 4px;
    }

    .message-bubble:not(.own) {
      border-bottom-left-radius: 4px;
    }

    .message-time {
      font-size: 11px;
      color: #aaa;
      margin-top: 4px;
      padding: 0 14px;
    }

    .input-area {
      padding: 16px 20px;
      border-top: 1px solid #e0e0e0;
      background: white;
    }

    .input-wrapper {
      display: flex;
      gap: 8px;
    }

    .message-input {
      flex: 1;
      padding: 10px 12px;
      border: 1px solid #d0d0d0;
      border-radius: 6px;
      font-size: 13px;
      font-family: inherit;
      resize: none;
      max-height: 80px;
    }

    .message-input:focus {
      outline: none;
      border-color: #667eea;
      box-shadow: 0 0 0 2px rgba(102, 126, 234, 0.1);
    }

    .send-btn {
      width: 36px;
      height: 36px;
      border: none;
      border-radius: 6px;
      background: #667eea;
      color: white;
      cursor: pointer;
      font-size: 16px;
      transition: all 0.2s;
    }

    .send-btn:hover:not(:disabled) {
      background: #764ba2;
    }

    .send-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    ::-webkit-scrollbar {
      width: 6px;
    }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb {
      background: #d0d0d0;
      border-radius: 3px;
    }
    ::-webkit-scrollbar-thumb:hover { background: #b0b0b0; }

    @media (max-width: 768px) {
      .sidebar { display: none; }
      .message-bubble { max-width: 85%; }
      .menu-panel { width: 100%; }
    }
  </style>
</head>
<body>

<div class="header">
  <h1>💬 Team Chat</h1>
  <div class="user-info">
    <div class="status-indicator"></div>
    <span id="current-user">User</span>
    <button class="header-menu-btn" onclick="openMenu()" title="More options">⋮</button>
  </div>
</div>

<div class="menu-modal" id="menu-modal" onclick="if(event.target === this) closeMenu()">
  <div class="menu-panel">
    <div class="menu-header">
      <h2>Options</h2>
      <button class="menu-close-btn" onclick="closeMenu()">✕</button>
    </div>
    
    <div class="menu-content">
      <div class="menu-item active" onclick="openChatHistory()">
        <span class="menu-icon">💬</span>
        <span>Chat History</span>
      </div>
      <div class="menu-item" onclick="openChangeHistory()">
        <span class="menu-icon">📜</span>
        <span>Change History</span>
      </div>
    </div>
  </div>
</div>

<div class="history-view" id="chat-history-view">
  <div class="menu-header">
    <h2>Chat History</h2>
    <button class="menu-close-btn" onclick="closeHistoryView()">✕</button>
  </div>
  <div class="history-items" id="chat-history-items">
    <div style="padding: 20px; text-align: center; color: #999;">Loading...</div>
  </div>
</div>

<div class="history-view" id="change-history-view">
  <div class="menu-header">
    <h2>Change History</h2>
    <button class="menu-close-btn" onclick="closeHistoryView()">✕</button>
  </div>
  <div class="history-items" id="change-history-items">
    <div style="padding: 20px; text-align: center; color: #999;">Loading...</div>
  </div>
</div>

<div class="container">
  <div class="sidebar">
    <div class="search-section">
      <div class="search-box">
        <input type="text" id="search-input" placeholder="Search by name or ID..." />
      </div>
    </div>
    <div class="contacts-list" id="contacts-list">
      <div style="padding: 20px; text-align: center; color: #999; font-size: 13px;">Loading contacts...</div>
    </div>
  </div>

  <div class="chat-area">
    <div class="chat-header">
      <div class="chat-title" id="chat-title">Select a contact to chat</div>
      <div class="chat-subtitle" id="chat-subtitle"></div>
    </div>

    <div class="messages" id="messages">
      <div class="empty-state">
        <div class="empty-icon">💭</div>
        <div style="font-size: 14px;"><strong>Welcome to Team Chat</strong><br>Select a contact from the left to start messaging</div>
      </div>
    </div>

    <div class="input-area" id="input-area" style="display: none;">
      <div class="input-wrapper">
        <textarea class="message-input" id="message-input" placeholder="Type your message..." rows="1"></textarea>
        <button class="send-btn" id="send-btn" title="Send (Ctrl+Enter)">➤</button>
      </div>
    </div>
  </div>

</div>

<script>
  let jwtToken = localStorage.getItem('jwtToken') || '';
  let currentUserId = null;
  let selectedUserId = null;
  let connection;
  let allMessages = [];
  let users = [];

  document.addEventListener('DOMContentLoaded', init);

  async function init() {
    if (!jwtToken) {
      jwtToken = prompt('Enter your JWT token:');
      if (jwtToken) localStorage.setItem('jwtToken', jwtToken);
    }

    const tokenData = parseJwt(jwtToken);
    currentUserId = tokenData?.sub || tokenData?.['http://schemas.xmlsoap.org/ws/2005/05/identity/claims/nameidentifier'];
    document.getElementById('current-user').textContent = `User ${currentUserId}`;

    await loadMessages();

    document.getElementById('send-btn').addEventListener('click', sendMessage);
    document.getElementById('message-input').addEventListener('keypress', (e) => {
      if (e.key === 'Enter' && e.ctrlKey) {
        sendMessage();
      }
    });
    document.getElementById('search-input').addEventListener('input', (e) => {
      filterContacts(e.target.value);
    });

    connectSignalR();

    document.getElementById('message-input').addEventListener('input', function() {
      this.style.height = 'auto';
      this.style.height = Math.min(this.scrollHeight, 80) + 'px';
    });
  }

  async function loadMessages() {
    try {
      const resp = await fetch('/api/chat/messages?pageSize=100', {
        headers: { 'Authorization': 'Bearer ' + jwtToken }
      });
      if (!resp.ok) throw new Error('Failed to load messages');
      allMessages = await resp.json();

      const userSet = new Set();
      allMessages.forEach(msg => {
        if (msg.sentByUserId !== currentUserId) {
          userSet.add(JSON.stringify({ id: msg.sentByUserId, name: msg.sentByUserName }));
        }
      });
      users = Array.from(userSet).map(s => {
        const parsed = JSON.parse(s);
        return { userId: parsed.id, userName: parsed.name };
      });

      renderContacts();
    } catch (e) {
      console.error('Error loading messages:', e);
    }
  }

  function renderContacts() {
    const list = document.getElementById('contacts-list');
    if (users.length === 0) {
      list.innerHTML = '<div style="padding: 20px; text-align: center; color: #999; font-size: 13px;">No contacts yet</div>';
      return;
    }

    list.innerHTML = users.map(user => `
      <div class="contact-item ${user.userId === selectedUserId ? 'active' : ''}" onclick="selectContact(${user.userId})">
        <div class="contact-avatar">${(user.userName || 'U').charAt(0).toUpperCase()}</div>
        <div class="contact-info">
          <div class="contact-name">${user.userName || 'Unknown'}</div>
          <div class="contact-id">ID: ${user.userId}</div>
        </div>
      </div>
    `).join('');
  }

  function selectContact(userId) {
    selectedUserId = userId;
    const selectedUser = users.find(u => u.userId === userId);
    
    document.getElementById('chat-title').textContent = selectedUser?.userName || `User ${userId}`;
    document.getElementById('chat-subtitle').textContent = `ID: ${userId}`;
    document.getElementById('input-area').style.display = 'block';

    renderMessages();

    document.querySelectorAll('.contact-item').forEach(el => el.classList.remove('active'));
    event.currentTarget.classList.add('active');
  }

  function renderMessages() {
    const messagesDiv = document.getElementById('messages');
    
    const filtered = allMessages.filter(m => 
      (m.sentByUserId === selectedUserId || m.sentByUserId === currentUserId) ||
      (m.receiverUserId === null)
    );

    if (filtered.length === 0) {
      messagesDiv.innerHTML = '<div class="empty-state"><div class="empty-icon">💬</div><div style="font-size: 14px;">No messages yet. Start the conversation!</div></div>';
      return;
    }

    messagesDiv.innerHTML = filtered.map(msg => {
      const isOwn = msg.sentByUserId === parseInt(currentUserId);
      return `
        <div class="message ${isOwn ? 'own' : ''}">
          ${!isOwn ? `<div class="message-avatar">${(msg.sentByUserName || 'U').charAt(0).toUpperCase()}</div>` : ''}
          <div>
            <div class="message-bubble">${escapeHtml(msg.content)}</div>
            <div class="message-time">${formatTime(msg.sentAt)}</div>
          </div>
        </div>
      `;
    }).join('');

    messagesDiv.scrollTop = messagesDiv.scrollHeight;
  }

  async function sendMessage() {
    const input = document.getElementById('message-input');
    const content = input.value.trim();
    if (!content) return;

    try {
      const requestBody = {
        content: content,
        receiverUserId: selectedUserId ? parseInt(selectedUserId) : null
      };

      const resp = await fetch('/api/chat/send', {
        method: 'POST',
        headers: {
          'Authorization': 'Bearer ' + jwtToken,
          'Content-Type': 'application/json'
        },
        body: JSON.stringify(requestBody)
      });

      if (!resp.ok) {
        const errorData = await resp.json();
        console.error('Error:', errorData);
        alert('Failed to send message: ' + (errorData.message || 'Unknown error'));
        return;
      }

      input.value = '';
      input.style.height = 'auto';

      await loadMessages();
      if (selectedUserId) selectContact(selectedUserId);
    } catch (e) {
      console.error('Error sending message:', e);
      alert('Failed to send message: ' + e.message);
    }
  }

  function filterContacts(query) {
    const list = document.getElementById('contacts-list');
    const items = list.querySelectorAll('.contact-item');
    const q = query.toLowerCase();
    items.forEach(item => {
      const title = item.querySelector('.contact-name').textContent.toLowerCase();
      item.style.display = title.includes(q) ? 'block' : 'none';
    });
  }

  function openMenu() {
    document.getElementById('menu-modal').classList.add('open');
  }

  function closeMenu() {
    document.getElementById('menu-modal').classList.remove('open');
  }

  async function openChatHistory() {
    closeMenu();
    document.getElementById('chat-history-view').classList.add('active');
    
    try {
      const resp = await fetch('/api/chat/history?pageSize=100', {
        headers: { 'Authorization': 'Bearer ' + jwtToken }
      });
      if (!resp.ok) throw new Error('Failed to load chat history');
      const data = await resp.json();

      const container = document.getElementById('chat-history-items');
      if (data.messages && data.messages.length > 0) {
        container.innerHTML = data.messages.map(msg => `
          <div class="history-item">
            <div class="history-item-avatar">${(msg.sentByUserName || 'U').charAt(0).toUpperCase()}</div>
            <div class="history-item-content">
              <div class="history-item-header">
                <span class="history-item-user">${msg.sentByUserName || `User ${msg.sentByUserId}`}</span>
                <span class="history-item-time">${formatTime(msg.sentAt)}</span>
              </div>
              <div class="history-item-text">${escapeHtml(msg.content)}</div>
              <div class="history-item-type">${msg.messageType}</div>
            </div>
          </div>
        `).join('');
      } else {
        container.innerHTML = '<div style="padding: 20px; text-align: center; color: #999;">No messages</div>';
      }
    } catch (e) {
      console.error('Error loading chat history:', e);
      document.getElementById('chat-history-items').innerHTML = '<div style="padding: 20px; text-align: center; color: #e94560;">Error loading history</div>';
    }
  }

  async function openChangeHistory() {
    closeMenu();
    document.getElementById('change-history-view').classList.add('active');
    
    try {
      const resp = await fetch('/api/chat/activity-history?pageSize=50', {
        headers: { 'Authorization': 'Bearer ' + jwtToken }
      });
      if (!resp.ok) throw new Error('Failed to load activity history');
      const data = await resp.json();

      const container = document.getElementById('change-history-items');
      if (data.activities && data.activities.length > 0) {
        container.innerHTML = data.activities.map(activity => `
          <div class="history-item">
            <div class="history-item-avatar">${(activity.user || 'U').charAt(0).toUpperCase()}</div>
            <div class="history-item-content">
              <div class="history-item-header">
                <span class="history-item-user">${activity.action}</span>
                <span class="history-item-time">${formatTime(activity.timestamp)}</span>
              </div>
              <div class="history-item-text">${activity.user}</div>
              <div class="history-item-type">${activity.details}</div>
            </div>
          </div>
        `).join('');
      } else {
        container.innerHTML = '<div style="padding: 20px; text-align: center; color: #999;">No activities</div>';
      }
    } catch (e) {
      console.error('Error loading activity history:', e);
      document.getElementById('change-history-items').innerHTML = '<div style="padding: 20px; text-align: center; color: #e94560;">Error loading history</div>';
    }
  }

  function closeHistoryView() {
    document.getElementById('chat-history-view').classList.remove('active');
    document.getElementById('change-history-view').classList.remove('active');
  }

  function connectSignalR() {
    connection = new signalR.HubConnectionBuilder()
      .withUrl('/hubs/notifications', { accessTokenFactory: () => jwtToken })
      .withAutomaticReconnect()
      .build();

    connection.on('MessageReceived', () => {
      loadMessages();
      if (selectedUserId) selectContact(selectedUserId);
    });

    connection.start().catch(e => console.error('SignalR error:', e));
  }

  function parseJwt(token) {
    try {
      const base64Url = token.split('.')[1];
      const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
      const jsonPayload = decodeURIComponent(atob(base64).split('').map((c) => {
        return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
      }).join(''));
      return JSON.parse(jsonPayload);
    } catch (e) {
      return null;
    }
  }

  function formatTime(isoDate) {
    if (!isoDate) return '';
    const d = new Date(isoDate);
    const now = new Date();
    const diff = now - d;
    
    if (diff < 60000) return 'now';
    if (diff < 3600000) return Math.floor(diff / 60000) + 'm';
    if (diff < 86400000) return Math.floor(diff / 3600000) + 'h';
    return d.toLocaleDateString();
  }

  function escapeHtml(text) {
    const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
    return text.replace(/[&<>"']/g, m => map[m]);
  }
</script>
